services:
  ldn-sender:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: ldn-sender
    userns_mode: "host"
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ldn-sender
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_SERVE_CONFIG: /config/generated/control-app-funnel.json
      TS_SERVE_TEMPLATE: /config/control-app-funnel.template.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      TBDRIVE_ROOT: ${TBDRIVE_ROOT:-/mnt/tbdrive}
    volumes:
      - ./tailscale/config:/config
      - ./tailscale/state:/var/lib/tailscale
      - ${HOST_TBDRIVE_ROOT:-/mnt/tbdrive}:${TBDRIVE_ROOT:-/mnt/tbdrive}
      - /dev:/host-dev
    devices:
      - /dev/net/tun:/dev/net/tun
    device_cgroup_rules:
      - "c 81:* rmw"
      - "c 116:* rmw"
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
