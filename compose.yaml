services:
  ldn-sender:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: ldn-sender
    userns_mode: "host"
    dns:
      - 100.100.100.100
      - 1.1.1.1
    dns_search:
      - tail84ebbf.ts.net
    environment:
      TS_CLIENT_ID: ${TS_CLIENT_ID}
      TS_CLIENT_SECRET: ${TS_CLIENT_SECRET}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ldn-sender
      TS_EXTRA_ARGS: --advertise-tags=tag:container
      TS_SERVE_CONFIG: /config/generated/control-app-funnel.json
      TS_SERVE_TEMPLATE: /config/control-app-funnel.template.json
      CONFIG_PATH: /config/config.yaml
      CENTRAL_CONFIG_URL: https://teateroen-server.tail84ebbf.ts.net/api/config
      CONFIG_SYNC_TIMEOUT_SECONDS: ${CONFIG_SYNC_TIMEOUT_SECONDS:-5}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    volumes:
      - ./tailscale/config:/config
      - ./tailscale/state:/var/lib/tailscale
      - /dev:/host-dev
    devices:
      - /dev/net/tun:/dev/net/tun
    device_cgroup_rules:
      - "c 81:* rmw"
      - "c 116:* rmw"
      - "c 226:* rmw"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
